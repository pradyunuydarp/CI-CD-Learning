---
- name: Deploy SciCalc Next container
  hosts: targets
  become: true
  collections:
    - community.docker
  vars:
    docker_image: "{{ lookup('env', 'DOCKER_IMAGE') | default('dockerhub-user/sci-calc-next:latest', true) }}"
    container_name: scicalc
    host_port: 3000
  tasks:
    - name: Pull calculator image
      docker_image:
        name: "{{ docker_image }}"
        source: pull

    - name: Ensure container is running
      docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}"
        state: started
        recreate: true
        restart_policy: unless-stopped
        ports:
          - "{{ host_port }}:3000"
