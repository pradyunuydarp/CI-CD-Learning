---
- name: Deploy SciCalc Next container
  hosts: targets
  gather_facts: false
  collections:
    - community.docker
  vars:
    docker_host: "{{ lookup('env', 'DOCKER_HOST') | default('unix:///var/run/docker.sock', true) }}"
  environment:
    DOCKER_HOST: "{{ docker_host }}"
  module_defaults:
    community.docker.docker_login:
      docker_host: "{{ docker_host }}"
    community.docker.docker_image:
      docker_host: "{{ docker_host }}"
    community.docker.docker_container:
      docker_host: "{{ docker_host }}"
  pre_tasks:
    - name: Load vault credentials when available
      ansible.builtin.include_vars:
        file: ../vault/secrets.yml
      no_log: true
      failed_when: false

  tasks:
    - name: Log in to Docker registry
      community.docker.docker_login:
        registry_url: "{{ docker_registry_url }}"
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
      when:
        - dockerhub_username is defined
        - dockerhub_username | length > 0
        - dockerhub_password is defined
        - dockerhub_password | length > 0

    - name: Pull SciCalc Next image
      community.docker.docker_image:
        name: "{{ docker_image }}"
        source: pull

    - name: Stop existing SciCalc Next container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped
      ignore_errors: true

    - name: Remove existing SciCalc Next container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: true

    - name: Ensure SciCalc Next container is running
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}"
        state: started
        recreate: true
        force_kill: true
        restart_policy: always
        published_ports:
          - "{{ host_port }}:{{ container_port }}"
        env:
          NODE_ENV: production
